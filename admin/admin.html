<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Booking Management Dashboard</title>
    <link rel="stylesheet" href="admin.css" />
</head>

<body>

    <h1>📋 Booking Management Dashboard</h1>

    <div class="export">
        <button id="exportBtn">⬇ Export to Excel</button>
        <div class="toggle-bar">
            <input type="checkbox" id="whatsappToggle" checked>
            Send WhatsApp message before changing status
        </div>



        <!-- ================= PENDING ================= -->
        <section>
            <h2>🟡 Pending Bookings</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Item</th>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="pendingList"></tbody>
            </table>
        </section>

        <!-- ================= ACCEPTED ================= -->
        <section>
            <h2>🟢 Accepted Bookings</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Item</th>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Phone</th>
                    </tr>
                </thead>
                <tbody id="acceptedList"></tbody>
            </table>
        </section>

        <!-- ================= REJECTED ================= -->
        <section>
            <h2>🔴 Rejected Bookings</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Item</th>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Phone</th>
                    </tr>
                </thead>
                <tbody id="rejectedList"></tbody>
            </table>
        </section>

        <script src="admin.js"></script>
</body>

</html>
